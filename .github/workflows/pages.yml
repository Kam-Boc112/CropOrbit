# Wersja na GitHub Pages bez serwera: folder static/ + moduły Pythona w py/.
# Pola przykładowe działają od ręki (static/demo/); własne pole liczy engine.js — ten sam Python w Pyodide (WebAssembly).
# Włączenie: Settings → Pages → Source: GitHub Actions (repozytorium musi być publiczne na darmowym planie).
name: Demo na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true  # włącza Pages przy pierwszym wdrożeniu, jeśli jeszcze nie są włączone
      - name: Złóż stronę (static/ + moduły Pythona dla silnika w przeglądarce)
        run: |
          mkdir -p _site/py
          cp -r static/. _site/
          cp i18n.py crops.py agro.py data_sources.py parcels.py rotation.py analysis.py _site/py/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
